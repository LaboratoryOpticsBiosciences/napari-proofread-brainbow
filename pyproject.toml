[project]
name = "napari-proofread-brainbow"
dynamic = ["version"]
description = "Proofreading Brainbow images with napari"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Seongbin Lim"},
  {email = "sungbin246@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
# napari can be included in dependencies if napari imports are required.
# However, you should not include napari[all], napari[qt],
# or any other Qt bindings directly (e.g. PyQt5, PySide2).
# See best practices: https://napari.org/stable/plugins/building_a_plugin/best_practices.html
dependencies = [
    "napari",  # imported at module level (napari.qt, napari.layers, napari_builtins)
    "numpy",
    "magicgui",
    "qtpy",
]

[project.optional-dependencies]
# Allow easily installation with the full, default napari installation
# (including Qt backend) using napari-proofread-brainbow[all].
all = ["napari[all]"]

[dependency-groups]
dev = [
    "tox-uv",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "prek",  # fast drop-in replacement for pre-commit
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[qt]",  # test with napari's default Qt bindings
]

[project.entry-points."napari.manifest"]
napari-proofread-brainbow = "napari_proofread_brainbow:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/LaboratoryOpticsBiosciences/napari-proofread-brainbow/issues"
"Documentation" = "https://github.com/LaboratoryOpticsBiosciences/napari-proofread-brainbow#README.md"
"Source Code" = "https://github.com/LaboratoryOpticsBiosciences/napari-proofread-brainbow"
"User Support" = "https://github.com/LaboratoryOpticsBiosciences/napari-proofread-brainbow/issues"

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_proofread_brainbow/_version.py"
fallback_version = "0.0.1+nogit"

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long. handled by formatter
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
]
