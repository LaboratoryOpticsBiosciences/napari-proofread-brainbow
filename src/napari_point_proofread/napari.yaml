name: napari-point-proofread
display_name: Point Proofread
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation"]
contributions:
  commands:
    - id: napari-point-proofread.make_qwidget
      python_name: napari_point_proofread._widget:MainWidget
      title: Make main proofreading widget
    - id: napari-point-proofread.postprocess_filters
      python_name: napari_point_proofread._postprocess_widget:PostProcessWidget
      title: Make post-processing widget
    - id: napari-point-proofread.compute_score
      python_name: napari_point_proofread._score_widget:compute_score
      title: Compute score between annotation and detection
    - id: napari-point-proofread.write_points
      python_name: napari_point_proofread._io:write_points_csv_preserve_types
      title: Write points CSV preserving integer properties
  widgets:
    - command: napari-point-proofread.make_qwidget
      display_name: Manual Proofread
    - command: napari-point-proofread.postprocess_filters
      display_name: Post-processing filters
    - command: napari-point-proofread.compute_score
      display_name: Compute score between annotation and detection
  writers:
    - command: napari-point-proofread.write_points
      layer_types: ["points"]
      filename_extensions: [".csv"]
